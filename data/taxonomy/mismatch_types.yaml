# LoopLens mismatch taxonomy v0.1 — a DRAFT. Edit it after reading real cases.
# A case = one product listing + one customer review with a photo.
# Verdict: does what the customer received match what the listing promised?
verdicts:
  - id: match
    definition: What the customer shows or describes is consistent with the listing.
  - id: mismatch
    definition: The customer received something that differs from what the listing promised.
  - id: unclear
    definition: Not enough evidence to decide (photo unrelated, review vague, listing empty).

# If the verdict is mismatch, which kinds of mismatch apply (one or more).
types:
  - id: wrong_item
    name: Wrong item
    definition: A different product, brand or model than the one listed.
    needs_image: true
  - id: colour_shade
    name: Colour or shade differs
    definition: Colour, shade or finish differs from the listing photos or description.
    needs_image: true
  - id: size_quantity
    name: Size or quantity differs
    definition: Smaller, larger, fewer pieces or less volume than listed.
    needs_image: false
  - id: damaged_defective
    name: Damaged or defective on arrival
    definition: Broken, leaking, crushed or not working when it arrived.
    needs_image: true
  - id: counterfeit_suspected
    name: Suspected fake
    definition: Packaging, labels or quality suggest it is not genuine.
    needs_image: true
  - id: missing_parts
    name: Missing parts or accessories
    definition: Items, parts or accessories promised in the listing are missing.
    needs_image: false
  - id: quality_far_below
    name: Quality far below listing
    definition: Materials or build are clearly worse than the listing claims.
    needs_image: false
  - id: feature_claim_false
    name: Feature claim false
    definition: A specific claimed feature or effect (e.g. "waterproof", "24h wear") does not hold.
    needs_image: false
