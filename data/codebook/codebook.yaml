# LoopLens codebook v0.1 — a DRAFT. Edit it: this is your research decision, not mine.
# Each code: an id, a short name, a one-line definition, and whether the image is needed to judge it.
codes:
  - id: quality_positive
    name: Good quality
    definition: The reviewer praises how well the product is made or how well it works.
    needs_image: false
  - id: quality_negative
    name: Poor quality
    definition: The reviewer complains the product is badly made, broke, or does not work.
    needs_image: false
  - id: price_value
    name: Price and value
    definition: The review talks about price, value for money, or being worth it (or not).
    needs_image: false
  - id: packaging
    name: Packaging and delivery
    definition: The review mentions the box, packaging, leaks, damage in transit, or delivery.
    needs_image: false
  - id: not_as_described
    name: Not as described
    definition: The product differs from the listing (size, colour, quantity, shade, scent).
    needs_image: false
  - id: visible_defect
    name: Visible defect in photo
    definition: The photo shows damage, a defect, a leak, or a wrong item.
    needs_image: true
  - id: photo_contradicts_text
    name: Photo contradicts text
    definition: What the photo shows does not match what the text says (e.g. text praises, photo shows damage).
    needs_image: true
  - id: photo_supports_text
    name: Photo supports text
    definition: The photo clearly illustrates the point the text makes.
    needs_image: true
  - id: effect_on_user
    name: Effect on skin or body
    definition: The reviewer describes a result on themselves (skin, hair, irritation, smell on them).
    needs_image: false
  - id: would_repurchase
    name: Repurchase or recommend
    definition: The reviewer says they would buy again or recommends it (or explicitly would not).
    needs_image: false
